# Continuous check: types, unit tests, build, browser checks. Config only: no secrets, no deploy, no accounts.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work plan integrity
        run: node tools/check_plan.mjs
      - name: Types
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Browser checks (built app, offline, no third-party requests)
        run: |
          npx playwright install --with-deps chromium
          node tools/e2e.mjs
      - name: Tests must not change tracked source or test files
        run: git diff --exit-code -- src tests
