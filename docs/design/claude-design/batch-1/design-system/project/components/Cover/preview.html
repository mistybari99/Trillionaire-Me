<html><head><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&display=swap" rel="stylesheet"><style>body{margin:0;background:var(--paper)}svg{display:block;width:960px;height:288px}.paper{fill:var(--paper)}.pri{fill:var(--primary)}.emb{fill:var(--ember)}.moss{fill:var(--moss)}.inkf{fill:var(--ink)}.rulef{fill:var(--rule)}.hair{stroke:var(--paper);stroke-width:1}.name{font:600 64px/0.95 "Fraunces",serif;fill:var(--ink)}.tag{font:400 14px var(--font-sans);fill:var(--muted)}</style></head><body>
<svg viewBox="0 0 960 288">

<rect class="paper" width="960" height="288"/>
<rect class="pri" x="496" y="0" width="224" height="192"/><rect class="rulef" x="720" y="0" width="128" height="80"/>
<rect class="emb" x="720" y="96" width="128" height="192"/><rect class="inkf" x="848" y="0" width="112" height="144"/>
<rect class="moss" x="496" y="208" width="208" height="80"/>
<line class="hair" x1="496" x2="960" y1="48" y2="48"/><line class="hair" x1="496" x2="960" y1="144" y2="144"/><line class="hair" x1="496" x2="960" y1="240" y2="240"/>
<text class="name" x="32" y="176">Trillionaire</text><text class="name" x="32" y="236">Me</text>
<text class="tag" x="32" y="262">Calm, step-by-step planning in ink and paper.</text>
</svg></body></html>
